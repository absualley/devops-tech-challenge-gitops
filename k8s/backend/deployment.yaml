apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-tech-challenge
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: 905418475979.dkr.ecr.us-east-1.amazonaws.com/devops-tech-challenge-gitops-backend:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8080
